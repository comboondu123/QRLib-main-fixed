services:
  qrlib:
    build: .
    container_name: qrlib
    restart: unless-stopped
    ports:
      # 宿主机端口用 PORT 覆盖：PORT=8080 docker compose up -d
      # 若提示 "port is already allocated"，说明 3000 被占用，先 docker rm -f 旧容器或换端口
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WEBUI_ENABLED: "${WEBUI_ENABLED:-true}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-15000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
